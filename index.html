function camS1(t) {

function sceneS1(g, t, tw) {

  glowAt(g, G_WARM, lx, ly, 900 * c.s, 0.12 + 0.03 * Math.sin(tw * 1.3));
  layer(g, IMG.s1_box, M.s1.layers.box, f);
  sparkles(g, M.s1.stars.map(([x, y]) => toS(f, x, y)), tw, 11, 1.0, [50, 105], [0.35, 0.7]);
  motes(g, tw, 22, 7, 0.9);

  layer(g, IMG.s2_dad, M.s2.layers.dad, f, { rot: -0.075 * lean, dx: -16 * lean });
  const bob = l > 2 ? Math.pow(Math.max(0, Math.sin(Math.PI * 2 * (lq - 2) / 1.0)), 2) : 0;

  motes(g, t, 18, 8, 0.7);

  if (sparkly) {
    const k = Math.sin(Math.PI * clamp01((t - t0) / dur));
    g.fillStyle = `rgba(255,240,230,${0.32 * k})`; g.fillRect(0, 0, W0, H0);
    const r = rng(83); sparkles(g, Array.from({ length: 22 }, () => [r() * W0, r() * H0]), t * 3, 84, k, [50, 120], [0.8, 1.4]);
  }
}
const FLASHES = [
  { seg: 'A', t: T.T_S2, peak: 0.42, rise: 0.25, fall: 0.35, col: '255,232,240' },
  { seg: 'A', t: T.T_S5, peak: 0.92, rise: 0.08, fall: 0.55, col: '255,255,255' },
  { seg: 'B', t: T.B_PHR3 - 0.35, peak: 0.55, rise: 0.04, fall: 0.3, col: '255,255,255' },
];
function postFX(g, st) {
  g.setTransform(K, 0, 0, K, 0, 0);
  const vg = g.createRadialGradient(CX, CY, 520, CX, CY, 1150);
  vg.addColorStop(0, 'rgba(18,6,16,0)'); vg.addColorStop(1, 'rgba(18,6,16,.34)');
  g.fillStyle = vg; g.fillRect(0, 0, W0, H0);
  const tnow = st.seg === 'A' ? st.t : st.seg === 'B' ? st.tb : null;
  if (tnow != null) for (const f of FLASHES) {
    if (f.seg !== st.seg) continue;
    let a = 0;
    if (tnow >= f.t - f.rise && tnow < f.t) a = f.peak * ein((tnow - (f.t - f.rise)) / f.rise);
    else if (tnow >= f.t && tnow < f.t + f.fall) a = f.peak * (1 - eout((tnow - f.t) / f.fall));
    if (a > 0) { g.fillStyle = `rgba(${f.col},${a})`; g.fillRect(0, 0, W0, H0); }
  }
  // film grain
  if (!noisePat) noisePat = g.createPattern(NOISE, 'repeat');
  const fr = Math.floor((st.seg === 'B' ? st.tb + 100 : (st.t || st.w || st.idle || 0)) * 24);
  const r = rng(fr * 7 + 3);
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.085;
  g.translate(-r() * 256, -r() * 256); g.fillStyle = noisePat; g.fillRect(0, 0, W0 + 512, H0 + 512); g.restore();
  if (FILM && st.seg === 'A' && st.t < 0.9) { g.fillStyle = `rgba(0,0,0,${1 - esin(st.t / 0.9)})`; g.fillRect(0, 0, W0, H0); }
}

// ------------------------------------------------------------------ overlay type (captions, final message, credits)
const CAPS = [
  { seg: 'A', t0: T.A1_B0, t1: 4.05, text: /*CHARS:round*/'11/11 限定版・媽媽公仔' },
  { seg: 'A', t0: 4.25, t1: 8.85, text: /*CHARS:round*/'全世界，只有一個' },
  { seg: 'A', t0: T.T_S2 + 2.05, t1: T.T_S3 - 0.2, text: /*CHARS:round*/'秘密任務開始！' },
  { seg: 'A', t0: T.T_S4 + 0.3, t1: T.T_S4 + 3.85, text: /*CHARS:round*/'派對準備完成！' },
  { seg: 'B', t0: T.B_HIT + 0.35, t1: T.B_PHR3 - 0.42, text: /*CHARS:round*/'媽媽，生日快樂！' },
];
const WISH = /*CHARS:round*/'許個願吧';
const FINAL = [
  { t0: 15.0, t1: 21.3, text: /*CHARS:hand*/'全世界只有一個的妳', fam: 'hand', size: 66, ly: 0.695, py: 0.16, fill: '#fff6ee' },
  { t0: 16.2, t1: 21.3, text: /*CHARS:round*/'生日快樂', fam: 'round', size: 140, ly: 0.81, py: 0.4, fill: '#ffffff', stroke: '#ef6b98', sw: 0.085, pop: true },
  { t0: 17.4, t1: 21.3, text: /*CHARS:hand*/'愛妳的老公＆兒子', fam: 'hand', size: 46, ly: 0.915, py: 0.62, fill: '#fff6ee' },
];
const CREDITS = [[/*CHARS:hand*/'主演', /*CHARS:hand*/'媽媽'], [/*CHARS:hand*/'特別演出', /*CHARS:hand*/'老公・兒子'], [/*CHARS:hand*/'道具', /*CHARS:hand*/'草莓蛋糕'], [/*CHARS:hand*/'製作', /*CHARS:hand*/'愛妳的我們']];
function capPos(frac, pfrac) {
  const L = LAY;
  if (!L.portrait) return { x: L.sx + L.sw / 2, y: L.sy + L.sh * frac, u: L.sh / H0 };
  const top = L.sy + L.sh, avail = L.mh - top - L.Bt;
  return { x: L.mw / 2, y: top + avail * pfrac, u: L.capU };
}
function capText(g, text, fam, size, pos, a, o, sc = 1, maxW) {
  if (a <= 0.003) return;
  let px = size * pos.u;
  const spr0 = txt(text, fam, px, o);
  const lim = (maxW || (LAY.portrait ? LAY.mw * 0.9 : LAY.sw * 0.92));
  if (spr0.tw > lim) px *= lim / spr0.tw;
  const spr = txt(text, fam, px, o);
  g.save(); g.globalAlpha = a; g.translate(pos.x, pos.y); g.scale(sc, sc);
  g.drawImage(spr.c, -spr.w / 2, -spr.h / 2); g.restore();
}
const CAP_STYLE = { fill: '#fff7ef', shadow: 'rgba(28,8,24,.82)' };
function overlays(g, st) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const seg = st.seg;
  const drawCap = (text, tt, t0, t1) => {
    const a = fadeIO(tt, t0, t1, 0.45, 0.3);
    if (a <= 0) return;
    const pos = capPos(0.885, 0.3), rise = (1 - eout((tt - t0) / 0.6)) * 16 * pos.u;
    capText(g, text, 'round', 64, { x: pos.x, y: pos.y + rise, u: pos.u }, a, CAP_STYLE, 0.985 + 0.015 * eout((tt - t0) / 0.6));
  };
  for (const c of CAPS) {
    if (c.seg === seg) drawCap(c.text, seg === 'A' ? st.t : st.tb, c.t0, c.t1);
  }
  if (seg === 'W') drawCap(WISH, st.w, 0.45, 1e9);
  if (seg === 'B' && st.tb < 0.5) drawCap(WISH, st.wBlow + st.tb, 0.45, st.wBlow + 0.38);
  if (seg !== 'B') return;
  const tb = st.tb;
  for (const f of FINAL) {
    const a = fadeIO(tb, f.t0, f.t1, f.pop ? 0.15 : 0.7, 0.45);
    if (a <= 0) continue;
    const pos = capPos(f.ly, f.py);
    const rise = f.pop ? 0 : (1 - eout((tb - f.t0) / 0.9)) * 20 * pos.u;
    const sc = f.pop ? 0.55 + 0.45 * eback((tb - f.t0) / 0.45, 2.2) : 1;
    capText(g, f.text, f.fam, f.size, { x: pos.x, y: pos.y + rise, u: pos.u }, a, { fill: f.fill, stroke: f.stroke, sw: f.sw, shadow: 'rgba(28,8,24,.75)' }, sc);
    if (f.pop && tb > f.t0 + 0.25) {
      const sp = txt(f.text, f.fam, f.size * pos.u, {});
      const beat = 1 + 0.08 * Math.pow(Math.max(0, Math.sin(6.283 * 1.2 * (tb - f.t0))), 6);
      const hs = 92 * pos.u * eback((tb - f.t0 - 0.25) / 0.4, 2) * beat;
      g.globalAlpha = a; g.drawImage(HEART, pos.x + sp.tw / 2 + 12 * pos.u, pos.y - hs * 0.58, hs, hs); g.globalAlpha = 1;
    }
  }
  // credits roll
  const L = LAY;
  const cu = L.portrait ? L.capU * 0.9 : L.sh / H0;
  const cx = L.portrait ? L.mw / 2 : L.sx + L.sw / 2;
  const top = L.portrait ? 0 : L.sy, hgt = L.portrait ? L.mh : L.sh;
  if (tb > 21.6 && tb < 28.2) {
    const p = (tb - 21.6) / 6.0;
    const y0 = top + hgt + 60 * cu - p * (hgt + 900 * cu);
    CREDITS.forEach(([role, name], i) => {
      const y = y0 + i * 200 * cu;
      const a = clamp01(Math.min((y - top) / (hgt * 0.18), (top + hgt - y) / (hgt * 0.18)));
      if (a <= 0) return;
      capText(g, role, 'hand', 34, { x: cx, y, u: cu }, a, { fill: '#e9c27b', shadow: 'rgba(20,6,16,.7)' });
      capText(g, name, 'hand', 60, { x: cx, y: y + 66 * cu, u: cu }, a, { fill: '#fff6ee', shadow: 'rgba(20,6,16,.7)' });
    });
  }
  if (tb > 27.3) {
    const a = clamp01((tb - 27.3) / 0.8);
    const cy = top + hgt * 0.47;
    capText(g, /*CHARS:script*/'Happy Birthday', 'script', 128, { x: cx, y: cy - 40 * cu, u: cu }, a, { fill: '#fff6ee', shadow: 'rgba(20,6,16,.75)' }, 0.96 + 0.04 * eout((tb - 27.3) / 0.8));
    capText(g, /*CHARS:hand*/'2026.11.11', 'hand', 46, { x: cx, y: cy + 82 * cu, u: cu }, a, { fill: '#e9c27b', shadow: 'rgba(20,6,16,.7)' });
  }
}

// ------------------------------------------------------------------ compose
function drawFrame(st) {
  renderStage(sg, st);
  postFX(sg, st);
  const L = LAY;
  mg.setTransform(1, 0, 0, 1, 0, 0);
  if (FILM) { mg.drawImage(S, 0, 0, L.mw, L.mh); }
  else {
    tg.drawImage(S, 0, 0, TINY.width, TINY.height);
    mg.fillStyle = '#1b1220'; mg.fillRect(0, 0, L.mw, L.mh);
    const cov = Math.max(L.mw / TINY.width, L.mh / TINY.height) * 1.08;
    mg.imageSmoothingEnabled = true; mg.imageSmoothingQuality = 'high';
    mg.globalAlpha = 0.85; mg.drawImage(TINY, (L.mw - TINY.width * cov) / 2, (L.mh - TINY.height * cov) / 2, TINY.width * cov, TINY.height * cov);
    mg.globalAlpha = 1; mg.fillStyle = 'rgba(22,10,22,.58)'; mg.fillRect(0, 0, L.mw, L.mh);
    mg.drawImage(S, L.sx, L.sy, L.sw, L.sh);
  }
  overlays(mg, st);
  if (FILM && st.seg === 'B' && st.tb > T.B_LEN - 1.2) { mg.fillStyle = `rgba(0,0,0,${esin((st.tb - (T.B_LEN - 1.2)) / 1.15)})`; mg.fillRect(0, 0, L.mw, L.mh); }
}

// ------------------------------------------------------------------ loading
async function loadVisuals(progress) {
  const ents = Object.entries(IMG_LIST);
  let done = 0;
  await Promise.all(ents.map(([k, src]) => loadImg(k, src).then(() => progress(++done, ents.length))));
  if (document.fonts) {
    await Promise.all(['64px "BdayRound"', '64px "Iansui"', '64px "Pacifico"'].map(f => document.fonts.load(f, f.includes('Pacifico') ? 'Surprise!' : '媽媽生日快樂').catch(() => {})));
    await document.fonts.ready;
  }
}

// ------------------------------------------------------------------ film mode
if (FILM) {
  document.getElementById('ui').hidden = true;
  window.__LEN = T.FILM_LEN;
  window.__ready = loadVisuals(() => {}).then(() => { layout(); return true; });
  window.__renderAt = (t) => {
    let st;
    if (t < T.T_W) st = { seg: 'A', t };
    else if (t < T.T_W + T.LOOP_LEN) st = { seg: 'W', w: t - T.T_W, hint: false };
    else st = { seg: 'B', tb: Math.min(t - T.T_W - T.LOOP_LEN, T.B_LEN), wBlow: T.LOOP_LEN };
    drawFrame(st);
    return true;
  };
  return;
}

// ------------------------------------------------------------------ live mode
const $open = document.getElementById('open'), $openLabel = document.getElementById('openLabel');
const $start = document.getElementById('start'), $hint = document.getElementById('hint'), $end = document.getElementById('end');
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, bufs = {}, nodes = [], loopNode = null, audioOK = false;
let st = { seg: 'idle', idle: 0 };
let t0A = 0, t0W = 0, t0B = 0, wBlow = 0, clockOff = 0;
const now = () => actx && audioOK ? actx.currentTime : performance.now() / 1000 - clockOff;

async function loadAudio(progress) {
  if (!AC) return;
  try {
    actx = new AC();
    const files = { A: 'assets/partA.mp3', L: 'assets/wish_loop.wav', B: 'assets/partB.mp3' };
    let done = 0;
    await Promise.all(Object.entries(files).map(async ([k, url]) => {
      const ab = await (await fetch(url)).arrayBuffer();
      bufs[k] = await new Promise((res, rej) => { const p = actx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
      progress(++done, 3);
    }));
    audioOK = true;
  } catch (e) { audioOK = false; }
}
function play(buf, when, loop = false) {
  const s = actx.createBufferSource(); s.buffer = buf; s.loop = loop;
  const gn = actx.createGain(); s.connect(gn); gn.connect(actx.destination); s.start(when);
  const n = { s, gn }; nodes.push(n); return n;
}
function stopAll() { for (const n of nodes) { try { n.s.stop(); } catch (e) {} } nodes = []; loopNode = null; }
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!actx) return;
  try { actx.resume(); const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); } catch (e) {}
}
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
function startShow() {
  unlockAudio(); keepAwake();
  stopAll(); $end.hidden = true; $hint.hidden = true;
  if (!audioOK) clockOff = performance.now() / 1000;
  const t = now() + 0.08;
  t0A = t; t0W = t + T.T_W;
  if (audioOK) { play(bufs.A, t0A); loopNode = play(bufs.L, t0W, true); }
  st = { seg: 'A', t: 0 };
  $start.classList.add('leaving'); setTimeout(() => { $start.hidden = true; }, 650);
}
function blow() {
  if (st.seg !== 'W') return;
  wBlow = now() - t0W;
  t0B = now() + 0.02;
  if (audioOK) {
    play(bufs.B, t0B);
    if (loopNode) { loopNode.gn.gain.setTargetAtTime(0, t0B, 0.07); try { loopNode.s.stop(t0B + 0.6); } catch (e) {} }
  }
  $hint.hidden = true;
  st = { seg: 'B', tb: 0, wBlow };
}
function tick() {
  const tn = now();
  if (st.seg === 'idle') st.idle = performance.now() / 1000;
  else if (st.seg === 'A') { st.t = Math.max(0, tn - t0A); if (st.t >= T.T_W) st = { seg: 'W', w: tn - t0W, hint: false }; }
  else if (st.seg === 'W') {
    st.w = tn - t0W;
    if (st.w > 1.6 && $hint.hidden) $hint.hidden = false;
    st.hint = st.w > 1.6;
    if (st.w > 16) blow();
  } else if (st.seg === 'B') {
    st.tb = Math.min(tn - t0B, T.B_LEN - 1.1);
    if (st.tb >= T.B_LEN - 1.6 && $end.hidden) { $end.hidden = false; }
  }
  try { drawFrame(st); } catch (e) { if (!tick.warned) { tick.warned = true; console.error(e); } }
  requestAnimationFrame(tick);
}
$open.addEventListener('click', startShow);
document.getElementById('replay').addEventListener('click', (e) => { e.stopPropagation(); startShow(); });
main.addEventListener('pointerdown', () => { if (st.seg === 'W' && st.w > 0.6) blow(); });
window.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && st.seg === 'W' && st.w > 0.6) { e.preventDefault(); blow(); } });
window.addEventListener('resize', () => layout());
document.addEventListener('visibilitychange', () => {
  if (!actx || !audioOK) return;
  if (document.hidden) actx.suspend().catch(() => {}); else if (st.seg !== 'idle') actx.resume().catch(() => {});
});

layout();
requestAnimationFrame(function first() { mg.fillStyle = '#1b1220'; mg.fillRect(0, 0, LAY.mw, LAY.mh); });
let vis = 0, aud = 0;
const prog = () => { const p = Math.round(((vis * 0.8) + (aud * 0.2)) * 100); $openLabel.textContent = `準備中… ${p}%`; };
Promise.all([
  loadVisuals((d, n) => { vis = d / n; prog(); }),
  loadAudio((d, n) => { aud = d / n; prog(); }),
]).then(() => {
  layout();
  $open.disabled = false; $openLabel.textContent = '打開禮物';
  requestAnimationFrame(tick);
}).catch(() => { $openLabel.textContent = '載入失敗，請重新整理'; });
})();
</script>
